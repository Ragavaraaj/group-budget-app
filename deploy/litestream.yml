# Continuous SQLite replication to S3-compatible storage (Backblaze B2 or Cloudflare R2).
# DRAFT: verify the exact keys for your provider against
# https://litestream.io/guides/s3-compatible/ before relying on it, then practise a restore:
#   litestream restore -config /etc/litestream.yml -o /tmp/restored.db /data/app.db
dbs:
  - path: /data/app.db
    replica:
      type: s3
      bucket: ${LITESTREAM_BUCKET}
      path: app.db
      endpoint: ${LITESTREAM_ENDPOINT}
      region: ${LITESTREAM_REGION}
      sync-interval: 10s # R2 bills write operations; raise this if you use it
