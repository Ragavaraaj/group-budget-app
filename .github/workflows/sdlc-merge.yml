name: SDLC merge

# Merges a board pull request once the gate is open: CI green on the head, no unresolved review
# threads, the AI review passed on the head, and your approval on the head. Merges with
# `SDLC_TOKEN` (a merge commit) so the push to main runs CI and deploys; the card goes to Done.
# The poller also checks the gate every ten minutes, because resolving a thread fires no event.
on:
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

concurrency:
  group: sdlc-merge-${{ inputs.pr || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write # start a conflict fix

env:
  PR: ${{ inputs.pr || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
  PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
  PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
  SDLC_OWNER: ${{ vars.SDLC_OWNER }}
  SDLC_ENABLED: ${{ vars.SDLC_ENABLED }}

jobs:
  merge:
    name: "Merge gate for #${{ inputs.pr || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}"
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.pull_requests[0].number)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: tools/sdlc
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          SDLC_TOKEN: ${{ secrets.SDLC_TOKEN }}
        run: node tools/sdlc/src/cli.ts merge --pr "$PR" --merge
