# Manual deploy to Cloudflare. DRAFT: untested until the first real deploy.
#
# One-time setup (see README "Deploying to Cloudflare"):
#   1. Create the D1 database and put its id in apps/server/wrangler.jsonc.
#   2. In the repo's Settings -> Secrets and variables -> Actions, add:
#        CLOUDFLARE_API_TOKEN   (a token with Workers Scripts:Edit and D1:Edit)
#        CLOUDFLARE_ACCOUNT_ID
#   3. Optionally create a "production" environment to require approval before deploys.
name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @budget/web
      # Schema first: a new Worker may rely on it. Migrations are additive and forward-only.
      - run: npm run db:migrate:remote -w @budget/server
      - run: npm run deploy -w @budget/server -- --var APP_VERSION:${{ github.sha }}
