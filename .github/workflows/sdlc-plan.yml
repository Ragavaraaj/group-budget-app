name: SDLC plan

# Turns a card's title into a plan, written into the issue body (the only place the plan lives).
# Started by the board poller for a new card, and by `/replan` (through SDLC board). Nothing is
# written to the repository: Claude returns the plan as structured output and the CLI puts it in
# the issue. The planning session and its context travel to the implementer as an artifact.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        type: number
      auto_implement:
        description: Go straight on to implementing (the card was put in In Progress unplanned)
        type: boolean
        default: false

concurrency:
  group: sdlc-issue-${{ inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write # read artifacts of earlier runs, and start the implement run
  id-token: write # the Claude GitHub App token

env:
  ISSUE: ${{ inputs.issue }}
  PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
  PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
  SDLC_OWNER: ${{ vars.SDLC_OWNER }}
  SDLC_ENABLED: ${{ vars.SDLC_ENABLED }}
  SDLC_MAX_PARALLEL: ${{ vars.SDLC_MAX_PARALLEL }}
  SDLC_SIMULATE_LIMIT: ${{ vars.SDLC_SIMULATE_LIMIT }}
  SDLC: node .sdlc-cli/tools/sdlc/src/cli.ts

jobs:
  plan:
    name: Plan issue #${{ inputs.issue }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The pipeline's own code, always from main, beside the working tree.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: .sdlc-cli
          sparse-checkout: |
            tools/sdlc
            .github/actions
          persist-credentials: false
      - run: echo '.sdlc-cli/' >> .git/info/exclude
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SDLC_TOKEN: ${{ secrets.SDLC_TOKEN }}
          AUTO: ${{ inputs.auto_implement }}
        run: $SDLC gate --stage plan --issue "$ISSUE" --auto-implement "$AUTO"

      - if: steps.gate.outputs.proceed == 'true'
        uses: ./.sdlc-cli/.github/actions/agent-env

      - id: resume
        if: steps.gate.outputs.proceed == 'true' && steps.gate.outputs.resume_run != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.gate.outputs.resume_artifact }}
          run-id: ${{ steps.gate.outputs.resume_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/resume
      - id: restore
        if: steps.resume.outcome == 'success'
        run: $SDLC restore-wip --dir "$RUNNER_TEMP/resume"

      - id: claude
        if: steps.gate.outputs.proceed == 'true'
        uses: ./.sdlc-cli/.github/actions/claude-run
        with:
          prompt: |
            Use the `sdlc-plan` skill for issue #${{ env.ISSUE }} in ${{ github.repository }}.
            Do not create or edit any file: the plan goes into your structured output, and the
            pipeline puts it in the issue.
          allowed-tools: >-
            Read, Glob, Grep, LS, Skill, Task, Agent, TodoWrite,
            Bash(graphify:*), Bash(gh issue view:*), Bash(gh issue list:*),
            Bash(git log:*), Bash(git show:*), Bash(git diff:*), Bash(ls:*), Bash(cat:*)
          max-turns: '60'
          schema: .sdlc-cli/tools/sdlc/schemas/plan.json
          resume: ${{ steps.restore.outputs.session }}
          model: ${{ vars.CLAUDE_MODEL || 'sonnet' }}
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}

      - id: verdict
        if: steps.gate.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SDLC_TOKEN: ${{ secrets.SDLC_TOKEN }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: $SDLC classify-run --file "$EXECUTION_FILE" --stage plan --issue "$ISSUE"

      - if: steps.verdict.outputs.kind == 'ok'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SDLC_TOKEN: ${{ secrets.SDLC_TOKEN }}
          SDLC_WORK: ${{ steps.gate.outputs.work }}
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          SESSION: ${{ steps.verdict.outputs.session_id }}
        run: $SDLC apply-plan --issue "$ISSUE" --session "$SESSION"
      - if: steps.verdict.outputs.kind == 'ok'
        uses: actions/upload-artifact@v4
        with:
          name: sdlc-plan-${{ env.ISSUE }}
          path: ${{ runner.temp }}/sdlc/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      # Anything but success: keep the session, then pause (a limit) or block (a failure).
      - if: steps.verdict.outputs.kind != '' && steps.verdict.outputs.kind != 'ok'
        env:
          SESSION: ${{ steps.verdict.outputs.session_id }}
        run: $SDLC save-wip --dir "$RUNNER_TEMP/wip" --session "$SESSION"
      - if: steps.verdict.outputs.kind != '' && steps.verdict.outputs.kind != 'ok'
        uses: actions/upload-artifact@v4
        with:
          name: sdlc-wip-${{ env.ISSUE }}
          path: ${{ runner.temp }}/wip/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - if: contains(fromJSON('["usage_limit","overloaded"]'), steps.verdict.outputs.kind)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SDLC_TOKEN: ${{ secrets.SDLC_TOKEN }}
          SDLC_WORK: ${{ steps.gate.outputs.work }}
          KIND: ${{ steps.verdict.outputs.kind }}
          RESET: ${{ steps.verdict.outputs.reset_at }}
          SESSION: ${{ steps.verdict.outputs.session_id }}
        run: $SDLC pause --kind "$KIND" --issue "$ISSUE" --reset-at "$RESET" --session "$SESSION" --artifact "sdlc-wip-$ISSUE"
      - if: steps.verdict.outputs.kind != '' && !contains(fromJSON('["ok","usage_limit","overloaded"]'), steps.verdict.outputs.kind)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SDLC_TOKEN: ${{ secrets.SDLC_TOKEN }}
          SDLC_WORK: ${{ steps.gate.outputs.work }}
          SDLC_MESSAGE: ${{ steps.verdict.outputs.message }}
          KIND: ${{ steps.verdict.outputs.kind }}
          SESSION: ${{ steps.verdict.outputs.session_id }}
        run: |
          $SDLC failed --issue "$ISSUE" --kind "$KIND" --session "$SESSION" --artifact "sdlc-wip-$ISSUE"
          exit 1
