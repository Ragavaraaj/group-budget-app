name: CI

# One workflow, one run per change:
#   - pull requests run the checks (a branch with an open PR is not also run on push, which
#     used to double every run);
#   - a merge to main runs the checks again and then deploys to Cloudflare;
#   - "Run workflow" on main redeploys without a code change.
#
# The app is built once, in `check`, and handed on as the `web-dist` artifact: the e2e shards test
# that build, and deploy ships that same build. Nothing is built twice, and what ships is what was
# tested.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# New pushes cancel the stale run on a PR. Never on main: cancelling halfway through a deploy
# could leave a migration applied without its Worker. Main runs queue instead, one at a time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  check:
    name: Lint, types, unit tests (workerd), build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:ts-only
      - run: npm run check:test-layout # unit tests live in each package's test/, never in src/
      - run: npm run check:bug-refs # every test.fail(...) names its bug issue
      - run: npm run lint:claude # agents and skills: frontmatter, references, model and effort
      - run: npm run lint # Biome: lint + format + import order
      - run: npm run typecheck
      - run: npm test
      # Builds the web app, then bundles the Worker with a dry-run deploy (catches config and
      # bundling problems without touching Cloudflare).
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7
      # Production dependencies only: dev tooling never ships. The dev-tooling advisories (undici
      # and sharp inside miniflare, esbuild inside drizzle-kit) are fixed with the `overrides` in
      # the root package.json, so a plain `npm audit` is clean too; drop an override once its
      # parent depends on a fixed version itself.
      - run: npm audit --omit=dev --audit-level=high

  # The suite split in three, each shard against the build from `check` (no rebuild). Each shard
  # runs its own `wrangler dev` with its own local database.
  e2e-shard:
    name: End-to-end shard ${{ matrix.shard }}/3
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/playwright-browsers
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - run: npx playwright test --shard=${{ matrix.shard }}/3 --reporter=blob,github
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  # Keeps the name the single e2e job had, so a required check on it still matches. Merges the
  # shards into one HTML report for people and one JSON report for the pipeline's CI fixer.
  e2e:
    name: End-to-end (Chromium and WebKit, wrangler dev)
    needs: e2e-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Nothing to merge when the shards never ran (the checks failed first).
      - if: needs.e2e-shard.result != 'skipped'
        run: npm ci
      - if: needs.e2e-shard.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge the shard reports
        if: needs.e2e-shard.result != 'skipped'
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json
        run: npx playwright merge-reports --reporter html,json ./all-blob-reports
      - uses: actions/upload-artifact@v4
        if: needs.e2e-shard.result != 'skipped'
        with:
          name: e2e-results
          path: e2e-results.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: needs.e2e-shard.result == 'failure'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Pass only if every shard passed
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "Shards: $SHARDS"
          test "$SHARDS" = success

  deploy:
    name: Deploy to Cloudflare
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Optional: add required reviewers to the "production" environment (repo Settings ->
    # Environments) to approve each deploy by hand.
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Until the Cloudflare account is connected this job reports what is missing and ends
      # green, so main is not red for a setup step. See README, "Deploying to Cloudflare".
      - name: Check deploy prerequisites
        id: ready
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=("secret CLOUDFLARE_API_TOKEN")
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=("secret CLOUDFLARE_ACCOUNT_ID")
          if grep -q '00000000-0000-0000-0000-000000000000' apps/server/wrangler.jsonc; then
            missing+=("the real database_id in apps/server/wrangler.jsonc")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            list=$(printf '%s, ' "${missing[@]}")
            msg="Deploy skipped. Still needed: ${list%, }. See README, 'Deploying to Cloudflare'."
            echo "::warning title=Deploy skipped::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ready.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.ready.outputs.ready == 'true'
        run: npm ci
      # The build the e2e tests ran against, not a new one.
      - if: steps.ready.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      # Schema first: a new Worker may rely on it. Migrations are additive and forward-only, so
      # the previous Worker keeps working while this runs. The token is passed only to the two
      # steps that talk to Cloudflare, not to the install above.
      - name: Apply database migrations
        if: steps.ready.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:remote -w @budget/server

      - name: Deploy the Worker and the web app
        if: steps.ready.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy -w @budget/server -- --var APP_VERSION:${{ github.sha }}
