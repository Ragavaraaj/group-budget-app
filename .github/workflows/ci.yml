name: CI

on:
  push:
    branches: [main, 'claude/**', 'migrate-cloudflare']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  check:
    name: Lint, types, unit tests (workerd), build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:ts-only
      - run: npm run lint # Biome: lint + format + import order
      - run: npm run typecheck
      - run: npm test
      # Builds the web app, then bundles the Worker with a dry-run deploy (catches config and
      # bundling problems without touching Cloudflare).
      - run: npm run build
      # Production dependencies only. The remaining advisories are in dev tooling that never ships:
      # the miniflare bundled inside the Workers test pool, and esbuild inside drizzle-kit. npm's
      # suggested "fix" is a breaking downgrade of both, so revisit when they release updates.
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (Chromium, wrangler dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
